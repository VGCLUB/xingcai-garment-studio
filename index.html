<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>形裁 · 制版工作台</title><link rel="stylesheet" href="studio.css"><link rel="stylesheet" href="workbench.css"></head><body>
<header><div class="brand"><i>◩</i>形裁</div><span class="divider"></span><input id="title" aria-label="工程名称" maxlength="64"><div class="actions"><select id="new" aria-label="新建工程"><option value="">新建工程</option><option value="vest">背心原型</option><option value="skirt">A 字裙原型</option><option value="blank">空白工程</option><optgroup label="打开试做样衣"><option value="sample0">双色拼片裙</option><option value="sample1">浅弧领长背心</option><option value="sample2">连袖短衫</option><option value="sample3">燕麦色压褶裙</option><option value="sample4">潮汐 · 欧根纱叠裙</option><option value="sample5">潮汐 · 收褶纱裙</option></optgroup></select><button id="imageDraft">图片制版</button><button id="open">打开</button><button id="save">保存</button><button id="simulate" class="primary">▶　模拟</button></div><input type="file" id="file" accept=".json" hidden></header>
<div class="workbench">
<section class="view"><div class="bar"><h2><em>3D</em> 试衣</h2><div><button id="photoTools" aria-expanded="false">棚拍渲染</button><button id="strain" aria-pressed="false">伸长率</button><button id="wire" aria-pressed="false">网格</button><button id="focus">看样衣</button><button id="camera">全景</button></div></div><div id="stage"><div class="view-note" id="phase">垂坠预览</div><div id="photos" hidden><label>灯光<select id="light"><option value="studio">中性柔光</option><option value="warm">暖调侧光</option><option value="night">深色轮廓光</option><option value="backlit">透光背光</option></select></label><label>机位<select id="pose"><option value="angle">四分之三</option><option value="front">正面</option><option value="back">背面</option><option value="detail">面料近景</option><option value="current">当前视角</option></select></label><label>输出<select id="resolution"><option value="2048">2048 × 2560</option><option value="3072">3072 × 3840</option></select></label><label>采样<select id="samples"><option value="8">精细 · 8 次</option><option value="16">精细 · 16 次</option><option value="1">快速 · 1 次</option></select></label><button id="photo">导出成衣 PNG</button></div><div id="strainLegend" hidden></div><div class="legend">拖动旋转 · 滚轮缩放</div></div></section>
<section class="drawing"><div class="bar"><h2><em>2D</em> 制版</h2><div><button id="undo" title="Ctrl+Z">撤销</button><button id="redo" title="Ctrl+Shift+Z">重做</button></div></div>
<div class="modebar"><button data-mode="edit">改版</button><button data-mode="sew">缝合</button><button data-mode="free">局部缝合</button><button data-mode="cut">分割</button><button data-mode="draw">画新片</button><button id="finish" hidden>完成轮廓</button></div>
<div class="sheet"><svg id="paper" viewBox="0 0 520 460" aria-label="制版画布"></svg></div><div id="hint"></div></section>
<aside><div class="bar"><h2>裁片与属性</h2><span class="unit">cm</span></div><div class="sidebody"><label class="cap" for="parts">裁片</label><select id="parts"></select><div id="props"></div><details class="propset" id="bodyprops"><summary>模特与围度</summary><label>试衣模特<select id="avatar"><option value="form">裁缝人台</option><option value="regular">全身模特 · 标准体型</option><option value="broad">全身模特 · 宽体型</option></select></label><div class="inputs" id="bodyfields"></div></details></div></aside>
<section class="stitch-panel"><div class="panel-head"><h2>缝线检查</h2><button id="arrange">重新布置</button></div><div id="seamList"></div></section>
<section class="output"><div class="panel-head"><h2>导出</h2></div><label class="allowance">统一缝份 <input id="allowance" aria-label="统一缝份" type="number" min="0" max="4" step="0.1" value="1"> cm</label><div class="outbuttons"><button id="svgout">1∶1 纸样 SVG</button><button id="glb">带面料 GLB</button><button id="obj">当前网格 OBJ</button></div><a href="skirt.html">进入裙装快速改版 ↗</a></section>
</div><footer><span class="lamp"></span><span role="status" id="status">准备就绪</span></footer>
<script src="vendor/three.min.js"></script><script src="vendor/poly2tri.min.js"></script><script src="cloth.js"></script><script src="avatar.js"></script><script src="dressform.js"></script><script src="pattern.js"></script><script src="garment.js"></script><script src="vendor/three-gltf-exporter.min.js"></script><script src="fabric-scans.js"></script><script src="vendor/cycles/sheen-table.js"></script><script src="cycles-material.js"></script><script src="material-system.js"></script><script src="material-graph.js"></script><script src="textiles.js"></script><script src="film.js"></script><script src="finishes.js"></script><script src="strain.js"></script><script src="viewer.js"></script><script src="vendor/clipper.js"></script><script src="cutting.js"></script><script src="examples.js"></script><script src="optics-example.js"></script><script src="gather-example.js"></script><script src="workbench.js"></script><script src="image-draft.js"></script><script src="material-editor.js"></script></body></html>
